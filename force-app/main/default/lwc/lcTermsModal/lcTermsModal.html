<template>
    <template if:true={showModal}>
        <section
            role="dialog"
            tabindex="-1"
            class="slds-modal slds-fade-in-open slds-modal_large"
            aria-modal="true"
            aria-labelledby="terms-modal-heading">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="terms-modal-heading" class="slds-text-heading_medium slds-hyphenate">
                        Launched Connect Guidelines
                    </h2>
                    <p class="slds-m-top_x-small slds-text-color_weak">
                        Version: {currentVersion}
                    </p>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-scrollable_y guidelines-scroll">
                        <div class="guidelines-content">
                            <h2>Welcome to Launched Connect</h2>
                            <p>
                                Launched Connect helps students connect with Student Ambassadors
                                to learn more about student life, university experiences, courses,
                                accommodation, activities and more.
                            </p>
                            <p>
                                As a Student Ambassador, you play an important role in helping students
                                feel welcomed, informed and confident about university life.
                            </p>
                            <p>Please follow these guidelines whenever you use Launched Connect.</p>

                            <h3>1. Be respectful and welcoming</h3>
                            <ul>
                                <li>Treat every student with respect and kindness.</li>
                                <li>Be polite, patient and welcoming.</li>
                                <li>Respect different backgrounds, cultures, opinions and experiences.</li>
                                <li>Do not use offensive, threatening or discriminatory language.</li>
                                <li>Do not bully, harass or intimidate students.</li>
                            </ul>

                            <h3>2. Keep conversations appropriate</h3>
                            <p>Use Launched Connect for appropriate student-related conversations.</p>
                            <p><strong>You can talk about:</strong></p>
                            <ul>
                                <li>Student life</li>
                                <li>Courses and studying</li>
                                <li>Accommodation and halls</li>
                                <li>Clubs and societies</li>
                                <li>University facilities</li>
                                <li>Campus life</li>
                                <li>The local area</li>
                                <li>Hobbies and interests</li>
                                <li>Your own student experience</li>
                                <li>Preparing for university</li>
                            </ul>
                            <p>Keep conversations relevant to the purpose of Launched Connect.</p>

                            <h3>3. Protect personal information</h3>
                            <p>Do not ask students for sensitive or unnecessary personal information.</p>
                            <p><strong>Never request or share:</strong></p>
                            <ul>
                                <li>Passwords</li>
                                <li>Bank or card details</li>
                                <li>Financial information</li>
                                <li>Identity documents</li>
                                <li>Security information</li>
                                <li>Other sensitive personal information</li>
                            </ul>
                            <p>Keep conversations within Launched Connect wherever possible.</p>

                            <h3>4. Stay within your role</h3>
                            <p>
                                Student Ambassadors share their own experiences and provide peer support.
                                You are not responsible for making official university decisions.
                            </p>
                            <p><strong>Do not guarantee:</strong></p>
                            <ul>
                                <li>Admission</li>
                                <li>Scholarships</li>
                                <li>Accommodation</li>
                                <li>Employment</li>
                                <li>Course outcomes</li>
                                <li>Other university decisions</li>
                            </ul>
                            <p>
                                If a student needs official information or support, direct them to the
                                appropriate university team.
                            </p>

                            <h3>5. Safeguarding and student wellbeing</h3>
                            <p>
                                If a student shares something that causes concern about their safety,
                                wellbeing or safeguarding, do not attempt to manage the situation yourself.
                            </p>
                            <ul>
                                <li>Listen respectfully.</li>
                                <li>Do not promise confidentiality.</li>
                                <li>Do not investigate the situation yourself.</li>
                                <li>Report concerns through the appropriate university process.</li>
                                <li>Contact the appropriate support team when required.</li>
                            </ul>

                            <h3>6. Keep messages appropriate</h3>
                            <p><strong>Please keep your messages:</strong></p>
                            <ul>
                                <li>Friendly</li>
                                <li>Clear</li>
                                <li>Relevant</li>
                                <li>Respectful</li>
                                <li>Professional</li>
                            </ul>
                            <p><strong>Do not send:</strong></p>
                            <ul>
                                <li>Sexual or inappropriate content</li>
                                <li>Offensive images or messages</li>
                                <li>Threats</li>
                                <li>Harassment</li>
                                <li>Discriminatory comments</li>
                                <li>Abusive messages</li>
                                <li>Unwanted or inappropriate contact requests</li>
                            </ul>

                            <h3>7. Respect student boundaries</h3>
                            <ul>
                                <li>Do not pressure a student to continue a conversation.</li>
                                <li>Respect their decision if they do not want to discuss a topic.</li>
                                <li>Do not request unnecessary personal contact details.</li>
                                <li>Keep communication within Launched Connect where possible.</li>
                                <li>Maintain appropriate professional boundaries.</li>
                            </ul>

                            <h3>8. Keep your profile accurate</h3>
                            <p>
                                Your Ambassador profile should accurately reflect your current student
                                experience and interests.
                            </p>
                            <ul>
                                <li>Keep your profile information up to date.</li>
                                <li>Make sure your interests and languages are accurate.</li>
                                <li>Update your availability when necessary.</li>
                                <li>Do not include inappropriate or misleading information.</li>
                            </ul>

                            <h3>9. Availability and response times</h3>
                            <p>
                                Students may contact you at different times. You are not expected to
                                respond immediately.
                            </p>
                            <ul>
                                <li>Keep your availability status accurate.</li>
                                <li>Respond when you are reasonably available.</li>
                                <li>Do not feel pressured to respond outside your availability.</li>
                                <li>Let the appropriate team know if you are unable to continue as an Ambassador.</li>
                            </ul>

                            <h3>10. Report a concern</h3>
                            <p><strong>Report a conversation if you experience:</strong></p>
                            <ul>
                                <li>Bullying or harassment</li>
                                <li>Threatening behaviour</li>
                                <li>Discrimination</li>
                                <li>Sexual or inappropriate messages</li>
                                <li>Requests for sensitive personal information</li>
                                <li>Safeguarding concerns</li>
                                <li>Any behaviour that makes you feel unsafe or uncomfortable</li>
                            </ul>
                            <p>
                                Use the available Report or moderation functionality where provided,
                                and contact the appropriate university team when necessary.
                            </p>

                            <h3>11. Looking after yourself</h3>
                            <p>
                                Supporting students can be rewarding, but it is important to look after
                                your own wellbeing too.
                            </p>
                            <ul>
                                <li>Take breaks when needed.</li>
                                <li>Do not feel responsible for solving every student concern.</li>
                                <li>Ask the university team for support when needed.</li>
                                <li>Maintain appropriate boundaries between your Ambassador role and personal life.</li>
                            </ul>

                            <h3>12. Remember</h3>
                            <div class="guidelines-callout">
                                <p><strong>Be respectful. Be safe. Be supportive. Be professional.</strong></p>
                                <p>
                                    Your role as a Student Ambassador is to share your experience,
                                    support students and help them feel more confident about university life.
                                </p>
                            </div>
                            <p>
                                If you need support or have a concern about a student interaction,
                                please contact the appropriate university team.
                            </p>

                            <h3>Contact the Launched Connect Team</h3>
                            <p>
                                If you have a question, need support, or want to report a concern,
                                please contact the Launched Connect team through the support channel
                                provided by your university.
                            </p>
                            <p>
                                <strong>
                                    By using Launched Connect as a Student Ambassador, you agree to follow
                                    these guidelines and the university's relevant policies and procedures.
                                </strong>
                            </p>
                        </div>
                    </div>

                    <div class="slds-m-top_large slds-border_top slds-p-top_medium">
                        <lightning-input
                            type="checkbox"
                            label="By continuing, I confirm that I have read and agree to the Launched Connect Guidelines."
                            checked={isChecked}
                            onchange={handleCheckboxChange}>
                        </lightning-input>
                        <template if:true={errorMessage}>
                            <p class="slds-text-color_error slds-m-top_small" role="alert">
                                {errorMessage}
                            </p>
                        </template>
                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Accept & Continue"
                        variant="brand"
                        disabled={isAcceptDisabled}
                        onclick={handleAccept}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
